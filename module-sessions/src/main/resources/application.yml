server:
  port: 8085

spring:
  application:
    name: module-sessions

  datasource:
    url: jdbc:postgresql://localhost:5437/security_sessions
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Spring Session — le dice a Spring que use Redis en lugar de memoria JVM
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: sessions-lab  # prefijo de las keys en Redis